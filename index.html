<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arsenal of Bureaucracy</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Saira+Stencil+One&display=swap" rel="stylesheet">
<style>
:root{--panel:#1d201b;--panel2:#262a23;--line:#4a4532;--brass:#a8925a;--brass2:#dcc78e;--ink:#e6e1d3;--dim:#9a968a;--red:#d0503f;--green:#76b357;--blue:#5f8fc4;--amber:#d9a441;--paper:#e9dfc4;--paperInk:#2b241a}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:#0e100d radial-gradient(ellipse at top,#22261d 0,#0e100d 70%);color:var(--ink);font:13px/1.38 "Segoe UI",system-ui,-apple-system,sans-serif;user-select:none}
.dim{color:var(--dim)}.red{color:var(--red)}.green{color:var(--green)}.gold{color:var(--brass2)}.blue{color:#8db4e0}.amber{color:var(--amber)}
button{font:inherit}
.btn{background:linear-gradient(#4b4531,#2c281c);border:1px solid var(--brass);color:var(--ink);padding:3px 9px;cursor:pointer;font-size:12px;border-radius:2px}
.btn:hover:not(:disabled):not(.off){background:linear-gradient(#5d5539,#383222);color:#fff}
.btn:disabled{opacity:.38;cursor:not-allowed}.btn.sm{padding:1px 6px;font-size:11px}.btn.on{background:linear-gradient(#8a7440,#5a4a26);color:#fff}
#top{position:relative;z-index:55;display:flex;align-items:center;gap:5px;padding:6px 10px;height:56px;background:linear-gradient(#2e3129,#1a1c17);border-bottom:2px solid var(--brass);overflow:hidden}
.logo{background:none;border:0;padding:0;cursor:pointer;font:700 14px Georgia;letter-spacing:.11em;color:var(--brass2);margin-right:4px;white-space:nowrap}.logo small{font-size:10px;color:var(--dim);font-style:italic}
.fac{font:600 12px Georgia;padding:2px 8px;border:1px solid var(--line);background:#151711;white-space:nowrap}
.res{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:64px;padding:2px 7px;border:1px solid #3a382c;background:#141611;color:inherit;font:inherit;cursor:pointer;height:44px}.res:hover{border-color:var(--brass);background:#1d2018}.res.rwarn{border-color:#9a6b20}.res.rwarn b{color:#f0c060}.res.ralert{border-color:var(--red);background:#2a1512}.res.ralert b{color:#ff9a8a}.res.rquiet b{color:var(--dim)}
.res b{font-size:14px;color:var(--brass2);font-family:Georgia;white-space:nowrap}.res span{font-size:8.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.07em;white-space:nowrap}
.res i{font-style:normal;font-size:10px;margin-left:2px}
.spacer{flex:1}
.date{font:700 14px Georgia;color:var(--brass2);padding:2px 10px;border:1px solid var(--brass);background:#0f110d;min-width:116px;text-align:center}
.crbadge{background:var(--red);color:#fff;font-weight:700;padding:3px 8px;font-size:11px;letter-spacing:.06em;animation:pulse 1.6s infinite;white-space:nowrap}
@keyframes pulse{50%{opacity:.55}}
#main{display:grid;grid-template-columns:350px minmax(420px,1fr) 410px;gap:8px;padding:8px;height:calc(100vh - 56px - 128px - 34px)}
.panel{background:var(--panel);border:1px solid var(--line);box-shadow:inset 0 0 0 1px #000,0 2px 8px #0008;overflow:auto;min-height:0}
.panel h2{margin:0;padding:6px 10px;font:600 11.5px Georgia;letter-spacing:.15em;text-transform:uppercase;color:var(--brass2);background:linear-gradient(#3b3727,#28251b);border-bottom:1px solid var(--brass);position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px}
.panel h2 .r{margin-left:auto;letter-spacing:0;text-transform:none;font-family:"Segoe UI",system-ui,sans-serif;font-weight:400}
.sub{font-size:10.5px;color:var(--dim)}
.sect{padding:5px 10px;font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--dim);border-bottom:1px solid #2e2c22;background:#191b16;display:flex;justify-content:space-between;gap:6px}
.tabs{display:flex;flex-wrap:wrap;gap:2px;padding:5px 6px;border-bottom:1px solid #2e2c22;background:#171914;position:sticky;top:29px;z-index:2}
.tabs .btn{font-size:10.5px;padding:1px 6px}
.nrow{padding:5px 10px;border-bottom:1px solid #2b2a20;cursor:pointer}
.nrow:hover{background:#262a21}
.nrow .top{display:flex;justify-content:space-between;align-items:center;gap:4px}
.nrow .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:8px;background:#0d0e0b;border:1px solid #39382b;margin:3px 0 2px;position:relative;overflow:hidden}
.bar i{position:absolute;top:0;bottom:0}
.bar .need{position:absolute;top:-2px;bottom:-2px;width:2px;background:#fff;z-index:2}
.hatch{background:repeating-linear-gradient(45deg,#5a2620 0 3px,#2a1512 3px 6px)}
.nums{font-size:10.5px;color:var(--dim);display:flex;gap:3px 8px;flex-wrap:wrap}
.tag{display:inline-block;padding:0 4px;font-size:9px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:2px;color:#111;white-space:nowrap}
.tag.cut,.tag.short{background:var(--red);color:#fff}.tag.tight{background:var(--amber);color:#111}.tag.ok{background:#3c5a30;color:#cfe8bd}
.tag.ss{background:#5a3a68;color:#f0dcff}.tag.kh{background:#3a3626;color:var(--brass2);border:1px solid #5a5236}.tag.dpa{background:#2f5f8f;color:#fff}.tag.ban{background:#7a2a20;color:#fff}.tag.t{background:#2b2a20;color:var(--dim);border:1px solid #444}
.legend{display:flex;gap:9px;padding:4px 10px;font-size:10px;color:var(--dim);border-bottom:1px solid #2e2c22;flex-wrap:wrap}
.legend i{display:inline-block;width:9px;height:9px;margin-right:3px;vertical-align:-1px}
.chain{padding:5px 10px;border-bottom:1px solid #2b2a20;font-size:11.5px}
.chain b{color:#fff}.chain .ar{color:var(--red);margin:0 3px}
.lrow{display:grid;grid-template-columns:30px 1fr auto;gap:6px;align-items:center;padding:5px 10px;border-bottom:1px solid #2b2a20}
.arrows{display:flex;flex-direction:column;gap:1px}.arrows .btn{padding:0 5px;font-size:9px;line-height:12px}
.pcard{margin:8px;border:1px solid var(--line);background:var(--panel2)}
.pcard .ph{display:flex;justify-content:space-between;align-items:baseline;padding:6px 9px;background:#2f3329;border-bottom:1px solid #3c3a2c;gap:8px}
.pcard .ph b{font-family:Georgia;font-size:13.5px}
.pcard.ally .ph{background:#283340}.pcard.plant .ph{background:#2c3324}.pcard.inh .ph{background:#3a3020}
.pipe{display:flex;gap:2px;padding:6px 9px 2px}
.pipe div{flex:1;text-align:center;font-size:9px;letter-spacing:.07em;padding:2px 0;background:#161812;color:#666;border:1px solid #2c2b22}
.pipe div.done{background:#2f4a26;color:#b8d8a4;border-color:#3f6633}.pipe div.cur{background:#5a4c26;color:#fff;border-color:var(--brass)}.pipe div.skip{opacity:.25}
.prog{margin:4px 9px 8px;height:7px;background:#0d0e0b;border:1px solid #38372a}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#8a7440,#dcc78e)}
.obs{margin:0 9px 9px;border:1px solid #6b2b24;border-left:5px solid;background:#2a1a17;padding:7px 9px}
.obs .ot{display:flex;align-items:center;gap:6px;margin-bottom:3px;flex-wrap:wrap}.obs .ot b{font-family:Georgia;font-size:13px}
.obs p{margin:3px 0 7px;color:#d8cfbf;font-size:12px}
.opts{display:flex;flex-direction:column;gap:4px}
.opt{display:flex;justify-content:space-between;gap:10px;text-align:left;width:100%}.opt .c{color:var(--brass2);font-size:11px;white-space:nowrap}
.waiting{font-size:12px;color:#e8cf9a}
.queued{font-size:10.5px;color:var(--dim);padding:0 9px 6px}
.empty{padding:20px;text-align:center;color:var(--dim);font-style:italic}
.yield{display:flex;align-items:center;gap:8px;padding:6px 9px 2px;font-size:11px}.yield .bar{flex:1;margin:0}
.prow{display:grid;grid-template-columns:1fr auto;padding:3px 10px;font-size:11.5px;border-bottom:1px solid #24231b}
.th{padding:8px 10px;border-bottom:1px solid #2b2a20}
.th .top{display:flex;justify-content:space-between;align-items:baseline}
.cvr{display:grid;grid-template-columns:minmax(0,1fr) 34% 40px;gap:6px;align-items:center;font-size:11.5px;margin:3px 0}.cvr .linkn{color:#e6e1d3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cvr .nb{margin:0;height:9px}.cvr b{text-align:right}.cvw{grid-column:1/4;font-size:10.5px;color:#a8a48e;margin:-2px 0 2px}.cvw .linkn{color:#e8b8a8}.th .mini .linkn{color:#cfc6ad}
.vs{display:flex;height:14px;border:1px solid #3a382b;margin:5px 0 3px}.vs i{display:block;height:100%}
.cvb{display:flex;gap:3px;margin:6px 0 2px;align-items:flex-end}.cvb span{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;cursor:pointer}.cvb .bx{height:30px;display:flex;align-items:flex-end;border-top:1px dashed #4d6b3a;border-bottom:1px solid #3a382b}.cvb i{display:block;width:100%}.cvb b{font:600 8.5px system-ui;color:#a8a48e;text-align:center;margin-top:2px;white-space:nowrap;overflow:hidden}
.ratio{font:700 16px Georgia}
.warn{color:#fff;background:var(--red);padding:1px 6px;font-size:10px;font-weight:700}
table.oob{width:100%;border-collapse:collapse;font-size:11.5px}
table.oob th{font-weight:600;color:var(--dim);font-size:10px;text-align:right;padding:4px 6px;border-bottom:1px solid #3a382b}
table.oob th:first-child,table.oob td:first-child{text-align:left}
table.oob td{padding:3px 6px;border-bottom:1px solid #24231b;text-align:right;vertical-align:top}
table.oob td b{font-family:Georgia;font-size:12.5px}table.oob .d{display:block;font-size:10px}
.meter{display:grid;grid-template-columns:96px 1fr 36px;gap:6px;align-items:center;padding:4px 10px;font-size:11.5px}
.meter .bar{margin:0;height:9px}
.mob{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;padding:4px 10px 8px}
.mob .btn{font-size:10px;padding:3px 2px;line-height:1.15}
.ref{padding:6px 10px;border-bottom:1px solid #2b2a20;display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center}
.ref .nm{font-weight:600}.ref .d{grid-column:1/3;font-size:10.5px;color:var(--dim)}
.ref.pass .nm{color:var(--green)}.ref.fail .nm{color:#d88}.ref.act{background:#22301f}
.bill{margin:8px 10px;padding:8px;border:1px solid var(--brass);background:#2b2719}
.lg{display:grid;grid-template-columns:10px 1fr 46px 34px;gap:6px;align-items:center;padding:3px 10px;font-size:11.5px}
.lg .sw{width:10px;height:10px}.lgbar{grid-column:2/5;height:4px;background:#0d0e0b;margin-top:-2px}.lgbar i{display:block;height:100%}
#log,#view,.paper .bd,.dmain,.rbdom,.bncard,.ncard,.obs p,#tip{user-select:text}
#log{margin:0 8px 8px;height:120px;overflow:auto;background:#0f110d;border:1px solid var(--line);font-size:11.5px}
#log h2{position:sticky;top:0;margin:0;padding:4px 10px;font:600 11px Georgia;letter-spacing:.16em;text-transform:uppercase;color:var(--brass2);background:#24221a;border-bottom:1px solid var(--brass)}
#log div{padding:2px 10px;border-bottom:1px solid #1d1d17}#log .d{color:var(--brass);margin-right:8px;font-family:Georgia}
#log .bad{color:#e49a8e}#log .good{color:#a8d48e}#log .ev{color:var(--brass2)}
#ov{position:fixed;inset:58px 0 0 0;background:#000b;display:none;align-items:center;justify-content:center;z-index:50;padding:16px}#ov.show{display:flex}#ov>*{max-height:calc(100vh - 90px)!important}
.paper{background:var(--paper) linear-gradient(#efe6cf,#e2d5b4);color:var(--paperInk);width:min(600px,100%);max-height:92vh;overflow:auto;border:3px double #6b5a35;box-shadow:0 10px 40px #000;font-family:Georgia,serif}
.paper .hd{background:#3a3020;color:var(--brass2);padding:9px 14px;font-size:17px;display:flex;gap:10px;align-items:center;position:sticky;top:0;z-index:1}
.paper .hd .ic{font-size:22px}
.paper .bd{padding:14px 18px;font-size:14px;line-height:1.5}.paper .bd p{margin:0 0 10px}
.paper .ft{padding:0 18px 16px;display:flex;flex-direction:column;gap:6px}
.pbtn{background:#d6c79e;border:1px solid #6b5a35;color:#2b241a;padding:6px 10px;text-align:left;cursor:pointer;font:13.5px Georgia}
.pbtn:hover:not(:disabled):not(.off){background:#c9b783}.pbtn:disabled{opacity:.45;cursor:not-allowed}
.pbtn.sm{font-size:12px;padding:3px 8px}
.wide{width:min(1060px,100%)}
.ptab{display:flex;flex-wrap:wrap;gap:4px;padding:8px 14px 0}
.ptab .pbtn{font-size:12px;padding:3px 8px}.ptab .pbtn.on{background:#3a3020;color:var(--brass2)}
.ctable{width:100%;border-collapse:collapse;font:12.5px "Segoe UI",system-ui,sans-serif}
.ctable td,.ctable th{padding:5px 8px;border-bottom:1px solid #cbbd95;text-align:left;vertical-align:top}
.ctable th{font-size:11px;color:#6b5a35;text-transform:uppercase;letter-spacing:.05em}
.ctable tr.al td{background:#e3e9ee}
.ctable .nm{font:600 13px Georgia}
.kv{display:grid;grid-template-columns:150px 1fr;gap:3px 10px;font:12.5px "Segoe UI",system-ui,sans-serif;margin:8px 0}
.kv b{font-weight:600}
.linkn{color:#5a3a10;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:2px;text-decoration-color:color-mix(in srgb,currentColor 30%,transparent);cursor:pointer}.linkn:hover{text-decoration-color:currentColor}
.chipsP{display:flex;flex-wrap:wrap;gap:4px}
.npill{display:inline-block;padding:1px 7px;border-radius:9px;font:11.5px "Segoe UI",system-ui,sans-serif;cursor:pointer;border:1px solid #8a7850}
.np-ok{background:#d6e8c8}.np-tight{background:#f2dca0}.np-short{background:#f0b3a8}.np-cut{background:#c0392b;color:#fff}
.map{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:10px 12px}
.map h4{margin:0 0 6px;font:700 12px Georgia;text-transform:uppercase;letter-spacing:.08em;color:#5a4a28}
.map .col{display:flex;flex-direction:column;gap:3px}
.map .npill{border-radius:3px;padding:3px 6px;display:flex;justify-content:space-between;gap:4px}
.stamp{display:inline-block;border:3px solid #a3261c;color:#a3261c;padding:2px 10px;font:700 20px Georgia;letter-spacing:.2em;transform:rotate(-4deg);margin:8px 0 18px}
#toasts{position:fixed;top:104px;left:50%;transform:translateX(-50%);width:min(520px,calc(100vw - 32px));display:flex;flex-direction:column;gap:6px;z-index:60;pointer-events:none}
.toast{background:#2a1a17;border:1px solid var(--red);border-left:5px solid var(--red);padding:7px 12px;box-shadow:0 6px 18px #000a;font-size:12.5px;animation:tin .25s;transition:opacity .3s}.toast.out{opacity:0}
.toast.news{background:#efe6cf;color:#2a2418;border:1px solid #a8925a;border-left:5px solid #8a6d2e}.toast.news .dim{color:#6b5a35}
.tn-h{display:flex;align-items:center;gap:8px}.tn-h b{font:600 15px var(--disp);letter-spacing:.02em;flex:1}.tn-ic{font-size:17px}.tn-x{font:600 11px var(--disp);letter-spacing:.08em;text-transform:uppercase;color:#8a6d2e;white-space:nowrap}
.tn-e{margin:2px 0 0 25px;font-size:12.5px;color:#3d5a2a;font-weight:600}.tn-b{display:none;margin:6px 0 2px 25px;font:14px/1.45 Georgia,serif}.tn-b p{margin:0 0 6px}.toast.open .tn-b{display:block}
.toast.good{border-color:var(--green);background:#1b2a17}
@keyframes tin{from{transform:translateX(30px);opacity:0}}
#start{max-width:1020px;margin:0 auto;padding:30px 20px;text-align:center}
#start h1{font:700 44px Georgia;letter-spacing:.14em;color:var(--brass2);margin:0}
#start .tag2{font:italic 16px Georgia;color:var(--dim);margin:6px 0 24px}
.fcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,560px));justify-content:center;gap:18px;text-align:left}
.fcard{border:1px solid var(--brass);background:var(--panel);padding:18px;cursor:pointer;transition:.15s}
.fcard:hover{background:#2c2f26;transform:translateY(-2px)}
.fcard h3{margin:0 0 4px;font:700 22px Georgia;color:var(--brass2)}.fcard ul{padding-left:18px;color:#cfc8b6;margin:10px 0 0}
.intro{margin-top:22px;text-align:left;color:#cfc8b6;border-top:1px solid var(--line);padding-top:14px;font-size:13px;columns:2;column-gap:28px}
.intro p{margin:0 0 9px;break-inside:avoid}
.paper .intro{columns:1;color:var(--paperInk);border:0;margin:0;padding:0}.paper .intro .gold{color:#6b4f1a}
.xl{width:min(1320px,100%)}
.sktool{display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding:8px 14px 0;font:12px "Segoe UI",system-ui,sans-serif}
.sktool .pbtn{font-size:11.5px;padding:2px 7px}.sktool .pbtn.on{background:#3a3020;color:var(--brass2)}
.sktool .lab{color:#6b5a35;margin:0 4px 0 8px;font-weight:600;text-transform:uppercase;font-size:10.5px;letter-spacing:.06em}
.sk{display:block;width:100%;height:auto;background:#efe6cf;border:1px solid #cbbd95}
.sk text{font:10.5px "Segoe UI",system-ui,sans-serif;fill:#2b241a;paint-order:stroke;stroke:#efe6cf;stroke-width:3px;cursor:pointer}.sk text.ch{pointer-events:none}.sk .nd:hover text{fill:#000;text-decoration:underline}
.sk text.ch{font-weight:700;font-size:11px;fill:#5a4a28;letter-spacing:.06em}
.sk .lk{transition:opacity .12s}.sk .nd{cursor:pointer}
.sk.dim .lk{opacity:.06!important}.sk.dim .lk.hot{opacity:.85!important}.sk.dim .nd{opacity:.25}.sk.dim .nd.hot{opacity:1}
.sklegend{display:flex;flex-wrap:wrap;gap:10px;font:11px "Segoe UI",system-ui,sans-serif;color:#5a4e38;padding:6px 14px}
.sklegend i{display:inline-block;width:10px;height:10px;margin-right:4px;vertical-align:-1px;border-radius:2px}
#views{display:flex;gap:3px;align-items:center;padding:4px 8px 0;height:30px}
.vbtn{background:#24221a;color:#cfc6ad;border:1px solid var(--line);border-bottom:none;padding:4px 12px;font:600 12px "Segoe UI",system-ui,sans-serif;cursor:pointer;border-radius:4px 4px 0 0}
.vbtn:hover{color:#fff;background:#302d22}.vbtn.on{background:var(--paper);color:#2b241a;border-color:var(--brass)}
.vbadge{background:#a03a30;color:#fff;border-radius:8px;padding:0 6px;font-size:10.5px;margin-left:4px}
.vhint{margin-left:auto;font:11px "Segoe UI",sans-serif;color:#8d8670}
#main.vmode{grid-template-columns:minmax(0,1fr) 390px}
.vpaper{background:var(--paper) linear-gradient(#efe6cf,#e2d5b4)!important;color:var(--paperInk);font:13px/1.45 "Segoe UI",system-ui,sans-serif;padding:0 12px 12px;border-color:var(--brass)!important}
.vhead{position:sticky;top:0;z-index:2;display:flex;gap:8px;align-items:center;padding:8px 0 6px;margin-bottom:6px;background:linear-gradient(#efe6cf,#ebe1c6);border-bottom:2px solid #8a7850}
.vhead b{font:700 18px Georgia}.vhead .ic{font-size:20px}.rng{display:flex;gap:3px}
.lgi{cursor:pointer;user-select:none}.lgi:hover{text-decoration:underline}.lgi.off{opacity:.38;text-decoration:line-through}
#tip{position:fixed;z-index:200;display:none;pointer-events:none;background:#1d1b15f2;color:#ece4cc;border:1px solid var(--brass);padding:6px 9px;font:12px/1.4 "Segoe UI",system-ui,sans-serif;max-width:320px;box-shadow:0 4px 14px #000a;border-radius:3px}
#tip .th{font-weight:700;color:var(--brass2);margin-bottom:3px}#tip .cr{color:#f0a090;font-weight:600}
#tip .tr{display:grid;grid-template-columns:12px 1fr auto;gap:6px;align-items:center}#tip .tr i{width:10px;height:10px;display:inline-block;border-radius:2px}#tip .tr i.dl{height:0;border-top:2px dashed;border-radius:0}
#tip .tr b{text-align:right;color:#fff}
svg.lc .hit{cursor:crosshair}
.flg{display:inline-block;width:1.4em;height:.93em;vertical-align:-.08em;border:.5px solid #0005;box-sizing:border-box}
.ctable.lev{table-layout:fixed;width:100%}.ctable.lev td,.ctable.lev th{vertical-align:top;overflow-wrap:anywhere}.ctable.lev td:last-child{text-align:right}.ctable.lev tr.grp td{text-align:left}
.ctable tr.grp td{font:700 11px "Segoe UI";letter-spacing:.06em;text-transform:uppercase;color:#6b5a35;background:#e6dbbd;padding:5px 8px;border-top:1px solid #cbbd95}

.dtimer b{color:#c9a227;white-space:nowrap}.dtt{opacity:.85}.dtt i{font-style:normal;font-weight:600}.dtimer.hot b{color:#e0604c}.dtimer.hot .dtb i{background:#e0604c}.dtimer.hot .dtb{border-color:#e0604c}.dtimer.hot .dti{animation:dthot 1s ease-in-out infinite}
@keyframes dthot{50%{opacity:.35}}.paper .dtb{background:#e6dbbd}.paper .dtimer b{color:#8a6a1f}.paper .dtimer.hot b{color:#a3261c}
/* decisions inbox */
.inbox{margin:4px 0 8px;border:1px solid #8a6a1f;background:#2a2618}.ibx{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:4px 8px;padding:5px 8px;border-top:1px solid #3a3424;font-size:12px}.ibx .sub{color:#c9b98f}
/* pop-ups keep their buttons in view */
.paper:has(>.bd){display:flex;flex-direction:column;overflow:hidden}.paper>.bd{overflow:auto;min-height:0;flex:1 1 auto}.paper>.hd,.paper>.ft{flex:none}
.opt.dflt{box-shadow:inset 0 0 0 2px #c9a227}.opt.dflt .c::after{content:' · default';color:#c9a227}.autoc{font-size:11px;margin:4px 0 2px;opacity:.85}
/* program page */
.paper .obs{color:var(--ink);font-family:"Segoe UI",system-ui,sans-serif}
.pstat{font:700 15px Georgia;padding:6px 10px;margin:4px 0 8px;background:#e6dbbd;border-left:5px solid currentColor}.pstat .mini{font-weight:400}
.gantt{display:block;background:#f3ebd6;border:1px solid #cbbd95}.gantt text{font-family:"Segoe UI",system-ui,sans-serif}
.kv .sw{display:inline-block;width:9px;height:9px;margin-right:5px;vertical-align:-1px}
/* import controls */
.icrow{display:grid;grid-template-columns:34px 1fr;gap:8px;padding:6px 10px;border-bottom:1px solid #2b2a20}.icrow.on{background:#1c2619}.icrow .nm{font-weight:600}.icrow .fx{margin-top:3px}
.tog{width:30px;height:16px;border-radius:8px;border:1px solid #6b6455;background:#2c2b22;position:relative;cursor:pointer;margin-top:2px;padding:0}
.tog i{position:absolute;top:1px;left:1px;width:12px;height:12px;border-radius:50%;background:#9a968a;transition:left .15s}
.tog.on{background:#3f6633;border-color:#76b357}.tog.on i{left:15px;background:#dcefc8}.tog.off{opacity:.4;cursor:not-allowed}
/* binding constraints */
.cstrip{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;padding:6px 8px;margin:4px 0 8px;background:#e6dbbd;border:1px solid #cbbd95;font:12.5px "Segoe UI",system-ui,sans-serif}
.cstrip>span{display:flex;align-items:center;gap:6px}.cstrip .bind{color:#8a1f15;background:#f0b3a8;padding:2px 6px;margin:-2px -6px;border-radius:2px}
/* the race */
.rc-pick{display:inline-flex;gap:3px;margin-left:4px;vertical-align:1px}.rc-pick .btn{font:600 11px "Segoe UI",system-ui,sans-serif;letter-spacing:0;text-transform:none}
.rc-rhead{display:grid;grid-template-columns:1.5fr repeat(4,1fr);gap:1px;background:var(--line);border-bottom:1px solid var(--brass)}
.rc-rhead>div{background:var(--panel2);padding:8px 10px;display:flex;flex-direction:column;justify-content:center;gap:2px}.rc-rhead b{font:700 18px Georgia;color:var(--ink)}.rc-rhead span{font-size:10.5px;color:var(--dim)}
.rc-rhead .rc-rbig b{font-size:30px;line-height:1}
.rc-rrow{background:var(--panel2);border:1px solid var(--line);padding:7px 9px 6px;margin:6px}
.rc-rh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:3px}.rc-rh>b{font:600 14px Georgia;color:var(--ink)}.rc-rh>span{font-size:11.5px}
.rc-rgrid{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:10px;align-items:center}
.rc-rb{display:grid;grid-template-columns:96px minmax(0,1fr) 150px;gap:6px;align-items:center;font-size:11px;margin:3px 0}.rc-rb .nb{height:10px;margin:0}.rc-rb .v{text-align:right;white-space:nowrap;color:#a8a48e}.rc-rb .v b{color:var(--ink)}
.rc-rlim{font-size:11.5px;margin-top:4px;color:#cfc6ad;display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px}.rc-rlim .linkn{color:#e8b8a8}.rc-rlim .btn{margin-left:auto}
.rc-rwork{font-size:11px;color:#a8a48e;margin-top:3px}.rc-rwork .linkn{color:#cfc6ad}.rc-rclr{color:#8fb87a;margin-left:6px}
/* defense needs */
.throw{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));border-bottom:1px solid var(--brass)}.throw .th{border-right:1px solid #2b2a20}
.ngrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:6px;padding:6px}
.ncard{background:var(--panel2);border:1px solid var(--line);padding:6px 8px 5px}
.ncard .hd{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:4px}.ncard .hd b{font:600 13px Georgia;color:var(--ink);text-decoration:none}
.nr{display:grid;grid-template-columns:58px 1fr 104px;gap:6px;align-items:center;font-size:10.5px;margin:3px 0}
.nr>span:first-child{color:var(--dim);font-size:9px;letter-spacing:.07em;text-transform:uppercase;white-space:nowrap}
.nr .v{text-align:right;color:#a8a48e;white-space:nowrap}.nr .v b{color:var(--ink)}
.nb{height:9px;background:#0d0e0b;border:1px solid #39382b;position:relative}.nb i{position:absolute;top:0;bottom:0;left:0}
.nb .mk{position:absolute;top:-3px;bottom:-3px;width:2px;background:#fff;z-index:1}.nb .mk.req{background:var(--brass2)}
.ngap{font-size:10.5px;margin-top:4px;display:flex;justify-content:space-between;gap:6px}
.rtabs{display:flex;gap:3px;padding:5px 6px 0;height:31px;background:#171914;border-bottom:1px solid var(--brass);position:sticky;top:0;z-index:3}
.rtabs .vbtn{font-size:11.5px;padding:3px 8px;white-space:nowrap}#right h2{top:31px}
/* change flashes: a row that just got worse/better pulses; delay is set negative so re-renders don't restart it */
.fl-bad{animation:flb 1.6s ease-out both}.fl-good{animation:flg 1.6s ease-out both}
@keyframes flb{0%{background:#c0392bcc;box-shadow:0 0 0 2px #e05a48}100%{background:transparent;box-shadow:0 0 0 0 transparent}}
@keyframes flg{0%{background:#4f8a38cc;box-shadow:0 0 0 2px #76b357}100%{background:transparent;box-shadow:0 0 0 0 transparent}}
/* dependency trace: hover anything, its whole chain lights up across panels */
.trc{transition:opacity .12s}
#app.tracing .trc:not(.hot){opacity:.22}
#app.tracing .trc.hot{box-shadow:inset 3px 0 0 var(--brass2)}
#app.tracing .cvb>span.trc.hot{box-shadow:none}#app.tracing .cvb>span.trc.hot b{color:#fff}
.rems{display:flex;flex-wrap:wrap;gap:3px;margin:-3px 0 6px}
.rem{font-size:10px;padding:0 5px;border:1px solid #5a5236;color:#cfc6ad;background:#1d1b14;cursor:pointer;border-radius:2px;white-space:nowrap}
.rem:hover{border-color:var(--brass2);color:#fff}.rem.on{border-color:#3f6633;color:#b8d8a4;background:#1b2a17;cursor:default}
.wchain{font-size:10.5px;margin-top:2px;color:var(--dim)}.wchain .linkn{color:#e8b8a8}.wchain .ar{color:var(--red);margin:0 3px}
.go-pulse{animation:gop 1.1s ease-in-out infinite}
@keyframes gop{50%{box-shadow:0 0 0 3px var(--brass2);background:linear-gradient(#8a7440,#5a4a26)}}
/* 2025–26 replay */
#reel{position:fixed;left:50%;bottom:146px;transform:translateX(-50%);z-index:45;display:flex;flex-direction:column-reverse;align-items:center;gap:8px;pointer-events:none;width:min(760px,92vw)}
#reel .bar2{pointer-events:auto;display:flex;gap:12px;align-items:center;background:#0f110df0;border:1px solid var(--brass);padding:5px 8px 5px 14px;font:600 12px Georgia;letter-spacing:.14em;color:var(--brass2);box-shadow:0 4px 16px #000}
#reel .bar2 .d{font-size:15px;letter-spacing:.06em;color:#fff;min-width:118px;text-align:center}
#reel .rp{width:160px;height:4px;background:#2c2b22}#reel .rp i{display:block;height:100%;background:var(--brass2)}
#reel .head{background:var(--paper) linear-gradient(#efe6cf,#e2d5b4);color:var(--paperInk);border:3px double #6b5a35;padding:12px 18px;font:600 17px/1.35 Georgia;box-shadow:0 10px 40px #000;text-align:center;animation:hin .35s ease-out both}
#reel .head small{display:block;font:700 10px "Segoe UI";letter-spacing:.2em;color:#8a1f15;margin-bottom:4px}
@keyframes hin{from{transform:translateY(-10px) scale(.97);opacity:0}}
.btn.off,.pbtn.off{opacity:.38;cursor:not-allowed}.nope{animation:nope .3s}
@keyframes nope{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
#handover{position:fixed;inset:0;z-index:44;display:flex;align-items:center;justify-content:center;pointer-events:none}
#handover div{border:4px solid #a3261c;color:#e8b0a0;background:#0e100dd0;padding:10px 28px;font:700 30px Georgia;letter-spacing:.22em;transform:rotate(-3deg);animation:hov 3.6s ease-in both;text-align:center}
#handover small{display:block;font-size:13px;letter-spacing:.3em;color:var(--brass2)}
@keyframes hov{0%{opacity:0;transform:rotate(-3deg) scale(1.6)}10%{opacity:1;transform:rotate(-3deg) scale(1)}75%{opacity:1}100%{opacity:0}}
/* crisis playback */
.camp{margin:6px 0 4px;font:12px "Segoe UI",system-ui,sans-serif}
.camp h5{margin:8px 0 3px;font:700 10.5px "Segoe UI";letter-spacing:.08em;text-transform:uppercase;color:#6b5a35;display:flex;justify-content:space-between}
.crow{display:grid;grid-template-columns:118px 1fr 92px;gap:8px;align-items:center;margin:2px 0}
.ctrack{height:13px;background:#d6c9a4;border:1px solid #8a7850;position:relative}
.ctrack i{position:absolute;left:0;top:0;bottom:0;animation:cgrow linear both;transform-origin:left}
.ctrack .dry{position:absolute;top:-3px;bottom:-3px;width:3px;background:#a3261c;animation:fadein .2s both}
.ctrack .goal{position:absolute;top:-3px;bottom:-3px;width:2px;background:#2b241a}
.crow .v{text-align:right;font-weight:600;animation:fadein .3s both}
@keyframes cgrow{from{transform:scaleX(0)}}@keyframes fadein{from{opacity:0}}
.gauge{position:relative;height:22px;margin:24px 0 18px;background:linear-gradient(90deg,#c98a7e 0,#c98a7e 40%,#e3cf8e 40%,#e3cf8e 56.67%,#a9c690 56.67%);border:1px solid #8a7850}
.gauge .zn{position:absolute;top:0;bottom:0;display:flex;align-items:center;justify-content:center;font:700 9.5px "Segoe UI";letter-spacing:.14em;text-transform:uppercase;color:#2b241a80}
.gauge .band{position:absolute;top:3px;bottom:3px;background:#2b241a33;border:1px dashed #2b241a}
.gauge .mk{position:absolute;top:-4px;bottom:-4px;width:3px}.gauge .mk span{position:absolute;top:100%;transform:translateX(-50%);font:600 10.5px "Segoe UI";white-space:nowrap;margin-top:2px}
.stampin{animation:stin .35s cubic-bezier(.3,1.6,.6,1) both}
@keyframes stin{from{opacity:0;transform:rotate(-4deg) scale(2.2)}}
@media(max-width:1180px){#main,#main.vmode{grid-template-columns:1fr;height:auto}.fcards{grid-template-columns:1fr}.intro{columns:1}.map{grid-template-columns:1fr 1fr}}
/* ===================== theme: the ops room ===================== */
:root{--disp:"Barlow Condensed","Arial Narrow","Segoe UI",system-ui,sans-serif;--sten:"Saira Stencil One","Barlow Condensed",Georgia,serif;--haz:repeating-linear-gradient(135deg,#c9a227 0 6px,#16160f 6px 12px)}
/* a faint blueprint grid under everything */
body{background:
  linear-gradient(rgba(168,146,90,.05) 1px,transparent 1px) 0 0/26px 26px,
  linear-gradient(90deg,rgba(168,146,90,.05) 1px,transparent 1px) 0 0/26px 26px,
  radial-gradient(ellipse at 50% -15%,#2b3125 0,#121510 55%,#080907 100%) fixed;background-color:#0b0c0a}
/* top bar: stencil logo, condensed readouts, a hazard stripe underneath */
#top{border-bottom:0;background:linear-gradient(#2d3228,#151712);box-shadow:0 3px 10px #000a}
#top::after{content:'';position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--haz);opacity:.9}
.logo{font:400 22px var(--sten);letter-spacing:.05em;color:#e8d08a;text-shadow:0 1px 0 #000,0 0 14px rgba(220,199,142,.2)}
.logo small{font:italic 400 12px Georgia;color:#8f8a78;letter-spacing:0}
.res{background:linear-gradient(#1c1f18,#0f110d);border-color:#3f3b2b;border-radius:2px;box-shadow:inset 0 1px 0 #ffffff0a}
.res b{font:700 20px var(--disp);letter-spacing:.02em;line-height:1}
.res span{font:600 10.5px var(--disp);letter-spacing:.12em}
.res i{font:600 12px var(--disp)}
.date{font:700 20px var(--disp);letter-spacing:.08em;box-shadow:inset 0 0 0 1px #000,0 0 10px rgba(201,162,39,.12)}
.btn{font-family:var(--disp);font-weight:600;font-size:13.5px;letter-spacing:.03em}.btn.sm{font-size:12.5px}
/* tabs read like file folders with stenciled labels */
#views .vbtn{font:600 14.5px var(--disp);letter-spacing:.07em;text-transform:uppercase;padding:3px 14px}
#views .vbtn.on{box-shadow:inset 0 3px 0 #c9a227}
.rtabs .vbtn{font:600 13.5px var(--disp);letter-spacing:.05em;text-transform:uppercase}
/* panels: reticle corners, stenciled headers with a hazard tab */
.panel{background:
  linear-gradient(var(--brass),var(--brass)) left bottom/16px 2px no-repeat,linear-gradient(var(--brass),var(--brass)) left bottom/2px 16px no-repeat,
  linear-gradient(var(--brass),var(--brass)) right bottom/16px 2px no-repeat,linear-gradient(var(--brass),var(--brass)) right bottom/2px 16px no-repeat,
  linear-gradient(180deg,#20241d,#161914);border-color:#3e3b2c}
.panel h2{font:400 15px var(--sten);letter-spacing:.09em;color:#e2cb85;background:linear-gradient(#34372a,#22241b);border-bottom:1px solid #6b5d38;box-shadow:0 2px 6px #0006}
.panel h2::before{content:'';flex:none;width:9px;height:15px;background:var(--haz);background-size:auto;margin-right:1px;opacity:.9}
.panel h2 .r{font-family:var(--disp);font-size:13px}
.sect{font-family:var(--disp);font-size:12px;letter-spacing:.1em}
/* the race */
.rc-rhead>div{background:linear-gradient(#262a22,#1b1e18)}
.rc-rbig{flex-direction:row!important;align-items:center;gap:10px}
.rc-gauge{flex:none;filter:drop-shadow(0 2px 4px #000a)}
.rc-gnum{display:flex;flex-direction:column;gap:2px}
.rc-rhead b{font-family:var(--disp)!important;font-size:26px;letter-spacing:.02em}
.rc-rhead .rc-rbig b{font-size:46px!important;line-height:.9}
.rc-rhead span{font:600 11.5px var(--disp);letter-spacing:.07em;text-transform:uppercase}
.rc-rrow{background:linear-gradient(180deg,#252922,#1d201a);border-color:#3b392b;box-shadow:inset 0 1px 0 #ffffff08}
.rc-ttl{display:flex;align-items:center;gap:9px;min-width:0}
.rc-ttl .lic{flex:none;color:#e2cb85;filter:drop-shadow(0 1px 0 #000)}
.rc-ttl b{font:700 18px var(--disp)!important;letter-spacing:.05em;text-transform:uppercase;color:var(--ink)}
.rc-rh>span{font:600 13px var(--disp);letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}.rc-rh>span b{font-size:21px;vertical-align:-1px}
.rc-rb .nb{height:13px;background:#0b0c09}
.rc-rb .nb::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 11px,rgba(0,0,0,.5) 11px 12px);pointer-events:none}
.rc-rb>span:first-child{font:600 12.5px var(--disp);letter-spacing:.07em;text-transform:uppercase;white-space:nowrap}
.rc-rb .v{font-family:var(--disp);font-size:13px}.rc-rb .v b{font:700 16px var(--disp)}
.rc-loss{font-family:var(--disp);letter-spacing:.05em;text-transform:uppercase;font-size:12.5px}
.rc-rlim .btn{text-transform:uppercase}
/* icons elsewhere */
.lic.sm{vertical-align:-3px;margin-right:5px;color:#e2cb85}
.dic .lic.big{color:#5a4a26}
/* decisions bar */
.dbl{font-family:var(--disp);letter-spacing:.05em;text-transform:uppercase}.dbl b{font-size:20px}
.dbt b{font-family:var(--disp);font-size:14px;letter-spacing:.02em}
#decbar{background:linear-gradient(#2c2616,#1f1b10);box-shadow:inset 4px 0 0 #c9a227}
.pcard{background:linear-gradient(180deg,#252922,#1c1f19);box-shadow:inset 0 1px 0 #ffffff08}.pcard .ph b{font:700 16px var(--disp);letter-spacing:.03em}.pcard .ph .linkn{text-decoration-thickness:1px;text-underline-offset:3px}
.nrow .nm{font:600 15px var(--disp);letter-spacing:.02em}.chain b.linkn,.chain>.linkn{font-family:var(--disp);font-size:14px;letter-spacing:.02em}
.pipe>div{font-family:var(--disp);font-size:11px;letter-spacing:.08em}
.tag{font-family:var(--disp);letter-spacing:.06em}
.paper .hd{font-family:var(--sten);font-weight:400;letter-spacing:.04em}.paper .hd .ic{filter:drop-shadow(0 1px 0 #0006)}
/* obstacle cards on paper pages: a document insert, not a dark panel */
.paper .obs{background:#f7f0dd;border:1px solid #c8b48a;border-left-width:5px;box-shadow:0 1px 3px #0002;color:var(--paperInk)}
.paper .obs .ot b{color:#7a1f15}.paper .obs p{color:#3a3020}.paper .obs .linkn{color:#5a4a26}
.paper .obs .opt{background:linear-gradient(#efe5c9,#e2d5b2);border:1px solid #a89770;color:#2b241a}.paper .obs .opt:hover:not(:disabled):not(.off){background:linear-gradient(#fbf5e4,#efe4c6);color:#000}
.paper .obs .opt .c{color:#6b5a35}.paper .obs .opt.dflt{box-shadow:inset 0 0 0 2px #b8860b}.paper .obs .opt.dflt .c::after{color:#8a6a1f}
.paper .obs .waiting{color:#7a4a10}.paper .obs .prog{background:#e6dbbd}
.paper .obs .dtt,.paper .obs .dtd{color:#3a3020;opacity:1}.paper .obs .dti{color:#6b5a35}
.paper .rem{background:#efe6cf;border-color:#b8a57a;color:#4a3d22}.paper .rem:hover{border-color:#6b5a35;color:#000}.paper .rem.on{background:#dfe9d2;border-color:#7a9a62;color:#2f4a22}
/* the record */
.rec-tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:2px 0 12px}
.rec-t{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto auto;column-gap:10px;align-items:baseline;padding:9px 12px;background:#f3ebd6;border:1px solid #cbbd95;box-shadow:inset 3px 0 0 #8a6a1f}
.rec-ic{grid-row:1/4;font-size:24px;align-self:center}.rec-t b{font:700 30px var(--disp);color:#2b241a;line-height:1}.rec-l{font:600 12px var(--disp);letter-spacing:.08em;text-transform:uppercase;color:#6b5a35}.rec-s{font-size:11.5px;color:#5a4e38}
.rec-charts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.rec-lines td{font-size:13px}.rec-lines tr.sub th{font-size:10.5px}
.rec-cols{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px;margin-top:10px}
.rec-bar{display:grid;grid-template-columns:150px 1fr 70px;gap:8px;align-items:center;font-size:12px;margin:3px 0}.rec-bar .nb{height:10px;margin:0;background:#e6dbbd;border-color:#cbbd95}.rec-bar b{text-align:right;font-family:var(--disp);font-size:14px}
.ucab{display:flex;gap:14px;align-items:center;justify-content:space-between;padding:8px 10px;background:#f7f0dd;border:1px solid #c8b48a;box-shadow:inset 4px 0 0 #b8860b}.ucab .pbtn{flex:none}
.rec-law{font-size:12px;padding:3px 0;border-bottom:1px dotted #cbbd95}
@media(max-width:1300px){.rec-tiles{grid-template-columns:repeat(2,1fr)}.rec-charts,.rec-cols{grid-template-columns:1fr}}
/* scenarios */
.sc-pick{margin:6px;padding:8px 10px;background:linear-gradient(#2e2a1a,#211d12);border:1px solid #8a6a1f;box-shadow:inset 4px 0 0 #c9a227}
.sc-ph{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}.sc-ph b{font:400 16px var(--sten);color:#e8d08a;letter-spacing:.05em}.sc-ph .btn{margin-left:auto}
.sc-opts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.sc-opt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:8px 10px;background:#1b1d16;border:1px solid #4a4532;color:var(--ink);cursor:pointer;font:12px "Segoe UI",system-ui,sans-serif}
.sc-opt:hover{border-color:#c9a227;background:#26281e}.sc-opt b{font:700 17px var(--disp);letter-spacing:.04em;text-transform:uppercase}.sc-ic{font-size:20px;line-height:1}.sc-dl{font:600 11px var(--disp);letter-spacing:.08em;text-transform:uppercase;color:#d9a441}.sc-m{color:#b8ad8a;font-size:11.5px;line-height:1.4}

let CH={},CHn=0,CHctx='v';
function chartRange(){if(S.range==='near'){const b=Math.min(END_W,Math.max(S.w+156,312));return [Math.max(0,b-312),b]}return [0,END_W]}
function lineChart({W=440,H=150,series,yMax,yFmt=fmtN,hl=[],marks=[],vf,unit}){
  const [x0,x1]=chartRange(),pl=38,pr=8,pt=8,pb=18,X=w=>pl+((w-x0)/(x1-x0))*(W-pl-pr),Y=v=>pt+(1-Math.min(v,yMax*1.05)/yMax)*(H-pt-pb);
  const hid=k=>k&&S.hide&&S.hide[k];
  const vis=series.filter(s=>!hid(s.k)).map(s=>({...s,pts:s.pts.filter(([w])=>w>=x0-6&&w<=x1+6)}));
  const hv=hl.filter(h=>!hid(h.k)),mk=marks.filter(m=>m.w>=x0&&m.w<=x1),id='c'+(++CHn);
  if(S.range==='near'){const m=Math.max(...vis.flatMap(s=>s.pts.map(p=>p[1])),...hv.map(h=>h.v),1e-9)*1.1;yMax=Math.min(yMax,m)}
  CH[id]={ctx:CHctx,W,H,pl,pr,pt,pb,x0,x1,yMax,f:vf||yFmt,series:vis,hl:hv,marks:mk};
  let g=`<svg class="lc" data-c="${id}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
  const step=(x1-x0)>400?2:1;
  if(x0<PLAY0){const xa=X(Math.max(x0,0)),xb=X(Math.min(PLAY0,x1));g+=`<rect x="${xa}" y="${pt}" width="${Math.max(0,xb-xa)}" height="${H-pt-pb}" fill="#d6c9a4" opacity=".28"/><text x="${xa+3}" y="${H-pb-3}" style="fill:#8a7a55;font-size:8px">replayed 2025–26</text>`}
  for(let y=2025;y<=2038;y+=step){const w=weekOf(y,0,4);if(w<x0||w>x1)continue;const x=X(w);g+=`<line x1="${x}" x2="${x}" y1="${pt}" y2="${H-pb}" stroke="#d6c9a4" stroke-width=".6"/><text x="${x}" y="${H-5}" text-anchor="middle">${y}</text>`}
  for(const f of [0,.5,1]){const v=yMax*f;g+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="#d6c9a4" stroke-width=".6"/><text x="${pl-4}" y="${Y(v)+3.5}" text-anchor="end">${yFmt(v)}</text>`}
  for(const m of mk)g+=`<line x1="${X(m.w)}" x2="${X(m.w)}" y1="${pt}" y2="${H-pb}" stroke="#a03a30" stroke-width="1" opacity=".55"/>`;
  for(const h of hv)g+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(h.v)}" y2="${Y(h.v)}" stroke="${h.c}" stroke-dasharray="4 3" stroke-width="1"/>`;
  if(S.w>=x0&&S.w<=x1)g+=`<line x1="${X(S.w)}" x2="${X(S.w)}" y1="${pt}" y2="${H-pb}" stroke="#2b241a" stroke-width="1" stroke-dasharray="2 2"/><text x="${X(S.w)+3}" y="${pt+8}" style="fill:#2b241a">now</text>`;
  if(unit)g+=`<text class="lcu" x="${W-pr-3}" y="${pt+10}" text-anchor="end">${unit}</text>`;
  for(const s of vis){if(!s.pts.length)continue;g+=`<polyline points="${s.pts.map(([w,v])=>`${X(w).toFixed(1)},${Y(v).toFixed(1)}`).join(' ')}" fill="none" stroke="${s.c}" stroke-width="${s.wd||1.8}" ${s.dash?`stroke-dasharray="${s.dash}"`:''} stroke-linejoin="round"/>`}
  if(unit){const m=g.match(/<text class="lcu"[^]*?<\/text>/);if(m)g=g.replace(m[0],'')+m[0]}
  return g+`<rect class="hit" x="${pl}" y="${pt}" width="${W-pl-pr}" height="${H-pt-pb}" fill="transparent"/><g class="hov"></g></svg>`;
}

     <div class="mini">2037 at current output: <b>${fmt(end,2)}</b> · if every line ran at capacity: <b>${fmt(endC,2)}</b>. Weakest link now: <b>${S._sc[t].est.bind?LINES[S._sc[t].est.bind].n:'—'}</b>. The grey dotted lines are the 10th and 90th percentiles over 40 draws from the scenario and intelligence ranges.</div></div>`}

function readyBody(){
  return `<p class="mini" style="margin:0 0 6px">Only available platforms count toward deterrence, for you and the enemy. Ships and aircraft built but waiting on a dry dock, parts, or depot repair are in service on paper only. Munitions are counted as fully available (shelf-life recertification isn't modeled). PRC and Russian availability are unknown; the game assumes ${pct(READY0.pac.subs)}–${pct(READY0.pac.surface)} for the PLA and ${pct(READY0.eu.subs)}–${pct(READY0.eu.surface)} for Russia.</p>

}

 ['New starts and offices','A new plant is paid for one of two ways: from your budget, starting now, or by requesting it in the next NDAA with Political Capital (about 2 PC plus 2.5 per $1B), in which case Congress pays if it funds it, from money it sets aside for requests (about $8B in an ordinary year, more or less with its appetite). The bill passes (the game passes it every 18 December, when recent NDAAs have been signed). Markup cuts fall hardest on plants that fix nothing holding output back and lightest on the worst bottlenecks, never absolutely, and Congress’s appetite swings from year to year (game estimates); money is charged only if funded. The bill also brings your annual industrial-base budget. Since the November 2025 overhaul, a portfolio acquisition executive runs each sector, not one office per plant; each office in the game staffs about three orders at full speed, and beyond that all its orders slow together (game estimate). Upgrades, workforce measures and allied deals are funded from existing accounts and start at once. After a shock (Chinese export bans, or a disaster at a plant), you can ask for an emergency supplemental: 30 PC, one a fiscal year, a vote in two to five months with a 75% chance of passing (game estimates); it adds $4B and funds every waiting new plant at once.[c:pl11850]'],
 ['Shared shortages','When an input is short, lines share it: each gets up to half its capacity first, then up to 80%, then the rest, with the priority order deciding who picks first in each round. A shortage slows several lines instead of shutting the last one in line (a game simplification of how allocation and DPA ratings work).'],
 ['Mid-length fixes','Supplier shifts add 15% of existing domestic capacity over a 13-week hiring ramp for $0.08B a year each and raise equipment-problem odds at new plants by 30%. While any shifts run, each line or supplier faces about a 0.25% weekly chance of an outage, rising to 0.75% after a year of wear: worn equipment (−30% for 4–8 weeks), an injury and safety stand-down (−40% for 2–4 weeks), or, where explosives are handled, a fire (−65% for 10–20 weeks). Repairs reset some of the wear. Overtime is linked to a 61% higher injury rate[c:dembe05] (estimates, set against Scranton’s rise, which also needed a $400M modernization).[c:scranton24] An undefinitized contract action ends contracting in about 4 weeks for 10% of the price, with a 25% chance of a cost overrun at construction (estimates; the risk itself is documented by the DoD IG).[c:ucaig] Not offered as fast fixes because they were not fast in practice: buying an ally’s production (Japan’s PAC-3 export took about two years from the December 2023 rule change to first delivery)[c:jpac3] and restarting closed lines.'],

 ['Allied sourcing limits','The bars themselves are statutory: Navy ships only from US yards (10 U.S.C. 8679)[c:yard8679] and bearings only from the US or Canada (DFARS 225.7009).[c:dfarsbr] Their game effect is a simplification: no allied supply or emergency buys for shipyards, submarine yards or bearings until a bill, waiver or presidential exception lifts them. The capacity the Ensuring Naval Readiness Act adds (+0.5 of base shipyard capacity, +3 surface ships a year)[c:s406] is an estimate. Specialty metals are limited to about 28 qualifying countries; that bar is not modeled item by item.'],
 ['Air-to-air and Army fires','US output: AMRAAM ~1,200 a year in 2025 (recent lots 1,160–1,200), GMLRS and PrSM ~12,000 a year retained by the US out of ~14,000 capacity (sourced capacity; the US share is an estimate). US stocks (12,000 air-to-air missiles, 25,000 rockets) are estimates: neither is public. Chinese and Russian output and stocks are game estimates with wide ranges; for the PL-15 the only public figures are open-source speculation (1,000–3,000 a year). Neither line is scored in the campaign scenarios yet.'],

 ['Sufficiency','The headline compares your output plus allied output with what the plan requires, line by line, capped at 100% and averaged over the nine lines. The requirement is the US public target (cited on each line) plus the allies’ own 2030 level, raised in proportion as the rival out-builds its own January 2027 level. You choose the rival, and with it the allies counted: Japan, South Korea and Taiwan against China; European allies against Russia (Ukraine excluded, since its output goes to its own war). Allied output rises from its 2027 level to its 2030 plan over three years. Allied deals build new capacity and take nothing from the allies. Emergency buys from existing allied output first use spare capacity (about 15% of it); only the remainder comes out of the allies’ own lines that use those inputs (allied suppliers assumed to sell a third of their output to you), at most half. Sustained buying makes allied suppliers expand, closing up to three-quarters of that squeeze over about two years, and the expansion stays. These are game estimates. The game ends in late 2037 and is judged on sufficiency: Arsenal Restored at 100%, Within Reach at 75%, Gained Ground if you rose at least 5 points from January 2027, otherwise Out-Built.'],

 ['Import controls (US)','Dates and scope of each control are sourced. Their game effects are assumptions: drone output up to −10%; US output of drone parts (cells, motors, boards, fiber, IR sensors) up to +20% as onshoring completes; drone line (−3% with an allied exemption) and −4% under tariffs while foreign parts are barred and US sources catch up, rising to +25% as the protected home market builds scale; onshoring takes about four years (1.5× faster with the Section 232 onshoring program, 2× if existing authorizations are pulled); obstacle, wait, cost and strain effects; and the Political Capital price of each switch.'],
 ['Starting inventories','Sourced where marked: US interceptor and strike stocks derived from CSIS 2026 estimates; ship counts from the Navy; aircraft from IISS; PLAN and PLARF counts from the CMPR; Russian missiles from Ukrainian intelligence. US and European shell stocks, European missile and air-defence stocks, Chinese interceptors and shells, and all drone stocks are estimates. Enemy ranges are listed above.'],
 ['Scenarios','Required weeks (Taiwan 3–8, central 4; eastern flank 8–26, central 12), launch rates, interceptors per threat, the share of salvos at defended targets, missiles per PLAN ship, anchored shell/drone/strike burns, allies’ shares, category weights, and the harmonic-mean score are assumptions with the ranges shown.'],

 ['DFARS','From 1 January 2027, DFARS 225.7018 (10 U.S.C. 4872) bars magnets, tungsten and tantalum with any Chinese, Russian, North Korean or Iranian mining or processing.[c:dfars7018] In the game, COTS and de-minimis exceptions leave ~20% of restricted supply usable (estimate); non-availability determinations open a 52-week carve-out.'],

   <table class="mtab"><tr><th>Reference project</th><th>What happened</th><th>Years</th><th>Model type</th><th>Model plan, before obstacles</th></tr>${REFCLASS.map(x=>{const k=x.a.split(' ')[0],A=ARCH[k];const d=A?A.dur:null;return `<tr><td>${x.p}</td><td>${x.real} [c:${x.c}]</td><td>${x.yrs}</td><td>${x.a}</td><td>${d?`${yrs(d.reduce((a,b)=>a+b,0))} (fund ${d[0]}w · contract ${d[1]} · permit ${d[2]} · build ${d[3]} · qualify ${d[4]} · market ${d[5]})`:x.a.startsWith('dry')?`${yrs(MXP[0].dur.reduce((a,b)=>a+b,0))} (build ${MXP[0].dur[3]}w)`:'line deliveries'}</td></tr>`}).join('')}</table>

  const sc=`<div class="acard"><div class="ah"><b>Scenario: optimistic / <b>central</b> / pessimistic</b></div><table class="mtab">${S.theaters.map(th).join('')}</table></div>`;

const tipEl=document.createElement('div');tipEl.id='tip';document.body.appendChild(tipEl);
let lastPt=null,hovSvg=null;
function clearHov(){if(hovSvg){const g=hovSvg.querySelector('.hov');if(g)g.innerHTML=''}hovSvg=null;tipEl.style.display='none'}
function showTip(html,x,y){tipEl.innerHTML=html;tipEl.style.display='block';const r=tipEl.getBoundingClientRect();let L=x+16,T=y+14;if(L+r.width>innerWidth-6)L=x-r.width-16;if(T+r.height>innerHeight-6)T=Math.max(4,y-r.height-12);tipEl.style.left=L+'px';tipEl.style.top=T+'px'}
function hoverAt(x,y){
  const el=document.elementFromPoint(x,y);if(!el||!el.closest){clearHov();return}
  const svg=el.closest('svg.lc'),d=svg&&CH[svg.dataset.c];
  if(d){const r=svg.getBoundingClientRect(),sx=(x-r.left)/r.width*d.W,sy=(y-r.top)/r.height*d.H;
    if(sx<d.pl||sx>d.W-d.pr){clearHov();return}
    const w=d.x0+(sx-d.pl)/(d.W-d.pl-d.pr)*(d.x1-d.x0),X=v=>d.pl+((v-d.x0)/(d.x1-d.x0))*(d.W-d.pl-d.pr),Y=v=>d.pt+(1-Math.min(v,d.yMax*1.05)/d.yMax)*(d.H-d.pt-d.pb);
    const best={};for(const s of d.series){let b=null,bd=1e9;for(const p of s.pts){const dd=Math.abs(p[0]-w);if(dd<bd){bd=dd;b=p}}if(!b||bd>10)continue;const key=s.n||s.c;if(!best[key]||bd<best[key].bd)best[key]={s,p:b,bd}}
    let dots='',rows=[];for(const k in best){const {s,p}=best[k];dots+=`<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="3.4" fill="${s.c}" stroke="#fff" stroke-width="1.2"/>`;rows.push([p[1],`<div class="tr"><i style="background:${s.c}"></i><span>${s.n||''}</span><b>${d.f(p[1])}</b></div>`])}
    rows.sort((a,b)=>b[0]-a[0]);for(const h of d.hl)if(h.n)rows.push([0,`<div class="tr"><i class="dl" style="border-color:${h.c}"></i><span>${h.n}</span><b>${d.f(h.v)}</b></div>`]);
    const m=d.marks.find(m=>Math.abs(m.w-w)<=8);
    if(hovSvg&&hovSvg!==svg){const g0=hovSvg.querySelector('.hov');if(g0)g0.innerHTML=''}
    hovSvg=svg;svg.querySelector('.hov').innerHTML=`<line x1="${X(w)}" x2="${X(w)}" y1="${d.pt}" y2="${d.H-d.pb}" stroke="#2b241a" stroke-width=".9" opacity=".7"/>`+dots;
    showTip(`<div class="th">${fmtDate(Math.max(0,Math.round(w)))}${w>S.w+2?' · <i>projected</i>':''}</div>${m?`<div class="cr">⚔ ${m.t}</div>`:''}${rows.map(r=>r[1]).join('')||'<div class="tr dim">No data here</div>'}`,x,y);return}
  if(hovSvg){const g0=hovSvg.querySelector('.hov');if(g0)g0.innerHTML='';hovSvg=null}
  const lb=S&&el.closest('[data-a=launch]');if(lb&&PD[lb.dataset.p]){const d=PD[lb.dataset.p];showTip((lb.classList.contains('off')?`<div class="cr">${whyOff(lb)}</div>`:'')+previewHTML(d,ctDefault(d)),x,y);return}
  const t=el.closest('[data-tip]');if(t){showTip(t.dataset.tip,x,y);return}
  tipEl.style.display='none';
}
document.addEventListener('pointermove',e=>{lastPt=[e.clientX,e.clientY];hoverAt(e.clientX,e.clientY)});
document.addEventListener('pointerleave',()=>{lastPt=null;clearHov()});

  if(a==='skip'){if(S.replay){endHistory();render()}return}
  if(S.replay&&REPLAY_LOCK.has(a))return;
  if(b.classList.contains('toast'))b.remove();
  if(NAV_ACTS.has(a))navPush();
  S._vdirty=true;
  switch(a){
    case 'speed':S.speed=+b.dataset.s;if(S.speed)S.lastSpeed=S.speed;break;
    case 'ap':S.autoPause=!S.autoPause;break;
    case 'tab':S.tab=b.dataset.t==='bott'?'bott':+b.dataset.t;S.view='cmd';if(S.modal&&S.modal!=='end'&&!S.queue.length)S.modal=null;break;
    case 'ptab':S.ptab=+b.dataset.t;break;
    case 'up':{const i=+b.dataset.i;[S.order[i-1],S.order[i]]=[S.order[i],S.order[i-1]];break}
    case 'dn':{const i=+b.dataset.i;[S.order[i+1],S.order[i]]=[S.order[i],S.order[i+1]];break}
    case 'cat':S.modal='cat';S.speed=0;break;
    case 'map':if(b.dataset.m)S.wmat=b.dataset.m;S.view='imports';if(S.modal&&S.modal!=='end'&&!S.queue.length){S.modal=null;S.navBack=[]}break;
    case 'flow':S.flowFocus=b.dataset.f||'all';S.view='flow';if(S.modal==='node'){S.modal=null;S.navBack=[]}break;
    case 'cite':S.view='src';S.citeHi=b.dataset.c;S._citeScroll=true;if(S.modal&&S.modal!=='end'&&!S.queue.length){S.modal=null;S.navBack=[]}break;
    case 'view':S.view=b.dataset.v;if(S.modal&&S.modal!=='end'&&!S.queue.length){S.modal=null;S.navBack=[]}break;
    case 'ser':S.hide=S.hide||{};S.hide[b.dataset.k]=!S.hide[b.dataset.k];break;
    case 'range':S.range=b.dataset.r;break;
    case 'flowm':S.flowMode=b.dataset.m;break;
    case 'flowv':S.flowV=b.dataset.v;break;
    case 'mdf':S.mdF=b.dataset.v;break;
    case 'flowa':S.flowAttr=b.dataset.m;break;
    case 'watch':newGame(S.fac,true);break;
    case 'prog':if(S.modal&&S.modal!=='prog')S.progBack={m:S.modal,sel:S.sel};else if(!S.modal)S.progBack=null;S.modal='prog';S.selP=b.dataset.u;S.speed=0;break;
    case 'progback':S.modal=S.progBack?.m||null;S.sel=S.progBack?.sel||S.sel;S.progBack=null;break;
    case 'goback':navBackG();break;
    case 'home':if(S.modal&&S.modal!=='end'&&!S.queue.length){S.modal=null;S.navBack=[]}S.view='cmd';break;
    case 'ovjump':S._ovScroll=b.dataset.s;break;
    case 'supp':suppAsk();break;
    case 'cseg':S.cseg=b.dataset.v;break;
    case 'bill':S.view='ndaa';if(S.modal&&S.modal!=='end'&&!S.queue.length){S.modal=null;S.navBack=[]}break;
    case 'refadd':refAdd(b.dataset.r,b.dataset.k==='rider');break;
    case 'refdrop':refDrop(b.dataset.r);break;
    case 'ndsadd':ndsAdd(b.dataset.n);break;
    case 'ndsdrop':ndsDrop(b.dataset.n);break;
    case 'billok':S.modal=null;S.view='cmd';S.billAlert=null;S.speed=S.billSpd||1;S.billSpd=null;break;
    case 'bmv':billAct('mv',b.dataset.u,b.dataset.d);break;
    case 'bch':billAct('champ',b.dataset.u);break;
    case 'bwd':billAct('wd',b.dataset.u);break;
    case 'bnow':billAct('now',b.dataset.u);break;
    case 'aotog':S.aoShut=!S.aoShut;break;
    case 'fcf':S.fcF=b.dataset.v;break;
    case 'pmf':(S.pmF=S.pmF||{ag:'all',st:'open',ph:'all'})[b.dataset.k]=b.dataset.v;S._vdirty=true;break;
    case 'rbtab':S.rbTab=b.dataset.t;S._vdirty=true;break;
    case 'pmgo':S.view='rules';S.rbTab='docket';S._vdirty=true;S.pmF={ag:b.dataset.g||'all',st:'open',ph:'all'};if(S.modal&&S.modal!=='end'&&!S.queue.length){S.modal=null;S.navBack=[]}break;
    case 'qj':setTimeout(qjOpen,0);break;
    case 'rcgo':S.view='cmd';S._rcJump=b.dataset.c;if(S.modal&&S.modal!=='end'&&!S.queue.length){S.modal=null;S.navBack=[]}break;
    case 'bngo':S.view='bn';S._scrollTo='#bn-'+b.dataset.n;if(S.modal&&S.modal!=='end'&&!S.queue.length){S.modal=null;S.navBack=[]}break;
    case 'rbgo':S.view='rules';S.rbTab='rules';S._vdirty=true;S._scrollTo=b.dataset.r?'#rl-'+b.dataset.r:'#rb-'+b.dataset.d;if(S.modal&&S.modal!=='end'&&!S.queue.length){S.modal=null;S.navBack=[]}break;
    case 'rtab':if(b.dataset.t==='agenda'){S.view='ndaa';if(S.modal&&S.modal!=='end'&&!S.queue.length){S.modal=null;S.navBack=[]}break}S.rtab=b.dataset.t;S._rtTop=true;break;
    case 'rival':if(!S.scen&&S.rival!==b.dataset.t){S.rival=b.dataset.t;setTheater(S.rival);S.resH=[];log(`You now measure yourself against ${RV().n}.`)}break;
    case 'remedy':if(S.modal==='prog')S.modal=null;if(CD[b.dataset.r])S.rtab='home';else{S.view='ndaa';S.modal=null;S.navBack=[]}S._jump=b.dataset.r;flash('ag:'+b.dataset.r,'good');break;
    case 'node':openDossier(b.dataset.n);break;
    case 'navback':S.sel=S.navBack.pop()||S.sel;break;
    case 'arsenal':S.view=({stock:'arsenal',pipe:'fac',ready:'ready'})[b.dataset.t]||'arsenal';if(S.modal==='node'){S.modal=null;S.navBack=[]}break;
    case 'spares':S.spares[b.dataset.l]=!S.spares[b.dataset.l];log(`🔧 ${LINES[b.dataset.l].n}: spare-parts priority ${S.spares[b.dataset.l]?'on':'off'}.`);break;
    case 'lineup':{const l=b.dataset.l,i=S.order.indexOf(l);if(i>0)[S.order[i-1],S.order[i]]=[S.order[i],S.order[i-1]];break}
    case 'close':if(S.billAlert){S.billAlert=null;S.speed=S.billSpd||1;S.billSpd=null}
if(S.modal==='prog'&&S.progBack){S.modal=S.progBack.m;S.sel=S.progBack.sel||S.sel;S.progBack=null;break}if(S.modal==='scenPick')S.scenSkip=true;S.modal=null;S.navBack=[];S.progBack=null;break;
    case 'launch':{const d=PD[b.dataset.p];if(needsContract(d)){S.ctBack=S.modal;S.ct={id:d.id,...ctDefault(d)};S.modal='contract';S.speed=0}else{startProject(d.id)}break}
    case 'ct':S.ct[b.dataset.g]=b.dataset.v;break;
    case 'ctgo':startProject(S.ct.id,{b:S.ct.b,k:S.ct.k},b.dataset.m||'pkg');S.modal=S.ctBack||null;S.ct=null;break;
    case 'ctback':S.modal=S.ctBack||null;S.ct=null;break;
    case 'opt':chooseOpt(b.dataset.u,+b.dataset.k);break;
    case 'ops':chooseOps(b.dataset.u,+b.dataset.k);break;
    case 'intro':introduce(b.dataset.r);break;
    case 'whip':whip();break;
    case 'carve':startCarve(b.dataset.c);break;
    case 'shift':toggleShift(b.dataset.l);break;
    case 'nshift':toggleNShift(b.dataset.n);break;
    case 'uca':doUCA(b.dataset.u);break;
    case 'ne':declareNE();break;
    case 'aid':setAid(+b.dataset.v);break;
    case 'prio':togglePrio(b.dataset.n);break;
    case 'spot':spotBuy(b.dataset.n);break;
    case 'repro':reprogram();break;
    case 'ic':toggleIC(b.dataset.c);break;
    case 'rule':toggleRule(b.dataset.r);break;
    case 'fw':framework(b.dataset.l);break;
    case 'evdo':{const it=(S.inbox||[]).find(x=>x.ev===b.dataset.e);S.inbox=(S.inbox||[]).filter(x=>x.ev!==b.dataset.e);S.queue.unshift({ev:b.dataset.e,fxDone:1,due:it?.due});S.speed=0;break}
    case 'recgo':S.view='rec';S.modal=null;S._vdirty=true;break;
    case 'scen':chooseScen(b.dataset.s);break;
    case 'scenskip':S.scenSkip=true;if(S.modal==='scenPick')S.modal=null;break;
    case 'scenpick':if(!S.scen&&S.w===PLAY0){S.modal='scenPick';S.speed=0}break;
    case 'scenon':S.modal=null;break;
    case 'scenstop':S.over=true;S.speed=0;S.verdict=S.scenRes.verdict;S.overWhy='';S.modal=null;S.view='rec';S._vdirty=true;break;
    case 'rcptx':if(S._rcpt)S._rcpt.gone=true;renderReceipt();return;
    case 'evread':S.queue.push({ev:b.dataset.e,fxDone:1,read:1});S.speed=0;break;
    case 'evopt':{const q=S.queue[0];if(q&&q.ev&&!q.read){const o=(V(ED[q.ev].o)||[])[+b.dataset.k];if(o){decRec(0);if(o.pc)S.pc-=o.pc;if(o.$)spendB(o.$,'Events');o.fx?.()}}S.queue.shift();S.pc=Math.max(0,S.pc);break}
    case 'restart':S=null;clearSave();break;
    case 'cntalk':cnTalk();break;
    case 'yrrec':S.modal=null;S.view='rec';break;
    case 'savem':saveGame();S.modal='save';S._svMsg='';S.speed=0;break;
    case 'savedl':saveGame();saveDownload();break;
    case 'saveul':saveUpload();break;
    case 'savenew':clearSave();S=null;break;
  }
  render();if(S)saveSoon();
});
document.addEventListener('keydown',e=>{
  if(!S||S.over||QJ||e.target.tagName==='INPUT')return;
  if((e.key==='k'&&(e.ctrlKey||e.metaKey))||e.key==='/'){e.preventDefault();qjOpen();return}
  if(e.altKey&&e.key==='ArrowLeft'){e.preventDefault();navBackG();render();return}
  if(e.code==='Space'){e.preventDefault();S.speed=S.speed?0:(S.lastSpeed||1);if(S.speed)S.modal=S.modal==='end'?S.modal:null;render()}
  else if(e.key==='Tab'&&!S.modal){e.preventDefault();const i=VIEWS.findIndex(v=>v[0]===(S.view||'cmd'));S.view=VIEWS[(i+(e.shiftKey?VIEWS.length-1:1))%VIEWS.length][0];render()}
  else if('1234'.includes(e.key)){S.speed=+e.key;S.lastSpeed=S.speed;render()}
  else if(e.key==='Escape'&&closable()){if(S.modal==='prog'&&S.progBack){S.modal=S.progBack.m;S.sel=S.progBack.sel||S.sel;S.progBack=null}else{S.modal=null;S.navBack=[]}render()}
});
const MS=[0,1000,500,190,60],RENDER_MS=[0,0,0,120,150];let acc=0,last=performance.now(),lastR=0,dirtyR=false;
function loop(now){
  const dt=now-last;last=now;
  if(S&&S.replay){
    if(!S.speed||S.modal){acc=0;if(S._reel)S._reel.t0=now} // paused: the headline waits too
    else if(S._reel&&now-S._reel.t0<REEL_HOLD)acc=0; // hold on the headline
    else{acc+=Math.min(dt,200);let ticked=false;
      while(S.replay&&S.speed&&acc>=REPLAY_MS[S.speed]&&!(S._reel&&now-S._reel.t0<REEL_HOLD)){acc-=REPLAY_MS[S.speed];S._reel=null;tick();S.queue=[];ticked=true;if(S.w>=PLAY0)endHistory()}
      if(ticked)render()}
    requestAnimationFrame(loop);return}
  if(S&&!S.over&&S.speed>0&&!S.queue.length&&!S.modal){acc+=Math.min(dt,500);let ticked=false;
    while(acc>=MS[S.speed]&&S.speed>0&&!S.queue.length&&!S.over){acc-=MS[S.speed];tick();ticked=true}
    if(ticked){dirtyR=true;if(S.w-(S._svW??-99)>=4)saveGame()}
    if(dirtyR&&(S.queue.length||S.over||!S.speed||now-lastR>=RENDER_MS[S.speed])){render();lastR=now;dirtyR=false}}
  else{acc=0;if(dirtyR&&S){render();lastR=now;dirtyR=false}}
  requestAnimationFrame(loop);
}
window.addEventListener('resize',()=>{if(S&&S.modal)renderModal()});
if(!resumeSave())render();requestAnimationFrame(loop);
</script>
